format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$line_break\
$shell\
$python\
$nix_shell\
$character
"""

[username]
format = '[ $user]($style) '
detect_env_vars = ['SSH_ENVIRONMENT']

[hostname]
ssh_only = true
ssh_symbol = " "
format = '[$ssh_symbol$hostname]($style) '
style = 'bold green'

[character]
success_symbol = '[➜](bold green) '
error_symbol = '[✗](bold red) '

[nix_shell]
symbol = '[](cyan)'
format = '$symbol  [$name]($style) '

[python]
symbol = '[](yellow)'
format = '($symbol  [$virtualenv](blue) )'
